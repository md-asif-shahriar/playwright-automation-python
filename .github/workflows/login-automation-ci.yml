name: Login Automation CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: login-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      PYTHONUNBUFFERED: "1"
      BASE_URL: ${{ vars.BASE_URL || 'https://www.rokomari.com' }}
      TEST_USER_NAME: ${{ vars.TEST_USER_NAME || 'Rok Test 123' }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Validate required test credentials
        shell: bash
        run: |
          if [[ -z "$TEST_USER_EMAIL" || -z "$TEST_USER_PASSWORD" ]]; then
            echo "::error::Configure TEST_USER_EMAIL and TEST_USER_PASSWORD as GitHub Actions secrets."
            exit 1
          fi

      - name: Run Playwright tests
        run: pytest -v
